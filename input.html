<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Absen — Input Lembur</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="libs/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">Easy <span>Absen</span></div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="input.html">Input Lembur</a></li>
        <li><a href="kalender.html">Kalender</a></li>
        <li><a href="riwayat.html">Riwayat</a></li>
        <li><a href="import.html">Import/Export</a></li>
        <li><a href="karyawan.html">Karyawan</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </aside>
    <main class="main">
      <div class="page-header"><h1>Input Lembur</h1></div>

      <div class="card">
        <form id="form-lembur" onsubmit="submitLembur(event)">
          <div class="form-row">
            <div class="form-group">
              <label>Tanggal</label>
              <input type="date" id="date" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Kategori</label>
              <select id="category" class="form-control">
                <option value="weekday">Hari Kerja</option>
                <option value="weekend">Akhir Pekan</option>
                <option value="holiday">Libur</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Jam Mulai</label>
              <input type="time" id="startTime" class="form-control" required onchange="updateTotal()">
            </div>
            <div class="form-group">
              <label>Jam Selesai</label>
              <input type="time" id="endTime" class="form-control" required onchange="updateTotal()">
            </div>
          </div>
          <div class="form-group">
            <label>Total Jam</label>
            <input type="text" id="totalHours" class="form-control" readonly style="background:var(--bg);">
          </div>
          <div class="form-group">
            <label>Aktivitas / Deskripsi</label>
            <textarea id="activity" class="form-control" rows="3" placeholder="Apa yang dikerjakan..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Project</label>
              <input type="text" id="project" class="form-control" placeholder="Nama project">
            </div>
          </div>
          <div class="form-group">
            <label>Estimasi Uang Lembur</label>
            <input type="text" id="payEstimate" class="form-control" readonly style="background:var(--bg);">
          </div>
          <div style="display:flex;gap:8px;">
            <button type="submit" class="btn btn-primary">Simpan Lembur</button>
            <button type="button" class="btn btn-outline" onclick="resetForm()">Reset</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    function loadEmployees() {
      ensureDefaultEmployee();
    }

    function updateTotal() {
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const total = calcTotalHours(start, end);
      document.getElementById('totalHours').value = total > 0 ? total.toFixed(2) + ' jam' : '';
      updatePayEstimate();
    }

    function updatePayEstimate() {
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const total = calcTotalHours(start, end);
      const cat = document.getElementById('category').value;
      const settings = getSettings();
      const pay = calcOvertimePay(total, cat, settings.baseSalary);
      document.getElementById('payEstimate').value = pay > 0 ? 'Rp ' + pay.toLocaleString('id-ID') : '';
    }

    document.getElementById('category').addEventListener('change', updatePayEstimate);

    function submitLembur(e) {
      e.preventDefault();
      const emp = getSelfEmployee();
      const dateVal = document.getElementById('date').value;
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const total = calcTotalHours(start, end);

      if (total <= 0) {
        showToast('Jam selesai harus lebih dari jam mulai', 'error');
        return;
      }

      const settings = getSettings();
      const cat = document.getElementById('category').value;
      const pay = calcOvertimePay(total, cat, settings.baseSalary);

      const entry = {
        id: genId(),
        employeeId: emp.id,
        employeeName: emp.name,
        date: formatDateYYYYMMDD(dateVal),
        startTime: start,
        endTime: end,
        totalHours: total,
        activity: document.getElementById('activity').value,
        project: document.getElementById('project').value,
        category: cat,
        baseSalary: settings.baseSalary,
        pay: pay,
        createdAt: new Date().toISOString()
      };

      const data = getOvertime();
      data.push(entry);
      saveOvertime(data);
      showToast('Lembur berhasil disimpan', 'success');
      resetForm();
    }

    function resetForm() {
      document.getElementById('form-lembur').reset();
      document.getElementById('totalHours').value = '';
      document.getElementById('payEstimate').value = '';
    }

    loadEmployees();
    // Set today's date
    document.getElementById('date').value = new Date().toISOString().slice(0,10);
  </script>
</body>
</html>
