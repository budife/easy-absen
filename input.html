<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Absen — Catat Lembur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=11">
  <script src="libs/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">Easy <span>Absen</span></div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="input.html">Input Lembur</a></li>
        <li><a href="kalender.html">Kalender</a></li>
        <li><a href="riwayat.html">Riwayat</a></li>
        <li><a href="import.html">Import/Export</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </aside>
    <main class="main">
      <div class="page-header"><h1>Input Lembur</h1></div>

      <div class="card">
        <form id="form-lembur" onsubmit="submitLembur(event)">
          <!-- Quick start time -->
          <div style="margin-bottom:12px;">
            <label style="font-size:0.8rem;font-weight:500;color:var(--text-muted);display:block;margin-bottom:6px;">Jam Mulai Cepat</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button type="button" class="btn btn-outline btn-sm" onclick="setStartTime('17:00')">17:00</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setStartTime('17:30')">17:30</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setStartTime('18:00')">18:00</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setStartTime('18:30')">18:30</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setStartTime('19:00')">19:00</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setStartTime('20:00')">20:00</button>
            </div>
          </div>

          <!-- Quick end time -->
          <div style="margin-bottom:16px;">
            <label style="font-size:0.8rem;font-weight:500;color:var(--text-muted);display:block;margin-bottom:6px;">Jam Selesai Cepat</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button type="button" class="btn btn-outline btn-sm" onclick="setEndTime('18:00')">18:00</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setEndTime('18:30')">18:30</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setEndTime('19:00')">19:00</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setEndTime('19:30')">19:30</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setEndTime('20:00')">20:00</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setEndTime('21:00')">21:00</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setEndTime('22:00')">22:00</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setEndTime('23:00')">23:00</button>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Tanggal</label>
              <input type="date" id="date" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Kategori</label>
              <select id="category" class="form-control">
                <option value="weekday">Hari Kerja</option>
                <option value="weekend">Akhir Pekan</option>
                <option value="holiday">Libur</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Jam Mulai</label>
              <input type="time" id="startTime" class="form-control" required onchange="updateTotal()">
            </div>
            <div class="form-group">
              <label>Jam Selesai</label>
              <input type="time" id="endTime" class="form-control" required onchange="updateTotal()">
            </div>
          </div>

          <div class="form-group">
            <label>Total Jam</label>
            <input type="text" id="totalHours" class="form-control" readonly style="background:var(--bg);font-size:1.2rem;font-weight:700;text-align:center;">
          </div>
          <div class="form-group">
            <label>Aktivitas / Deskripsi</label>
            <textarea id="activity" class="form-control" rows="2" placeholder="Apa yang dikerjakan..."></textarea>
          </div>
          <div class="form-group">
            <label>Project</label>
            <input type="text" id="project" class="form-control" placeholder="Nama project">
          </div>
          <div class="form-group">
            <label>Estimasi Uang Lembur</label>
            <input type="text" id="payEstimate" class="form-control" readonly style="background:var(--bg);font-weight:600;">
          </div>
          <div style="display:flex;gap:8px;">
            <button type="submit" class="btn btn-primary">Simpan Lembur</button>
            <button type="button" class="btn btn-outline" onclick="resetForm()">Reset</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    function setStartTime(time) {
      document.getElementById('startTime').value = time;
      updateTotal();
    }

    function setEndTime(time) {
      document.getElementById('endTime').value = time;
      updateTotal();
    }

    function updateTotal() {
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const total = calcTotalHours(start, end);
      document.getElementById('totalHours').value = total > 0 ? total.toFixed(2) + ' jam' : '';
      updatePayEstimate();
    }

    function updatePayEstimate() {
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const total = calcTotalHours(start, end);
      const cat = document.getElementById('category').value;
      const settings = getSettings();
      const pay = calcOvertimePay(total, cat, settings.baseSalary);
      document.getElementById('payEstimate').value = pay > 0 ? 'Rp ' + pay.toLocaleString('id-ID') : '';
    }

    document.getElementById('category').addEventListener('change', updatePayEstimate);
    document.getElementById('startTime').addEventListener('change', updateTotal);
    document.getElementById('endTime').addEventListener('change', updateTotal);

    function submitLembur(e) {
      e.preventDefault();
      const dateVal = document.getElementById('date').value;
      const dateKey = formatDateYYYYMMDD(dateVal);
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const total = calcTotalHours(start, end);

      if (total <= 0) {
        showToast('Jam selesai harus lebih dari jam mulai', 'error');
        return;
      }

      const settings = getSettings();
      const cat = document.getElementById('category').value;
      const pay = calcOvertimePay(total, cat, settings.baseSalary);

      // Check if already has overtime on this date
      const existing = getOvertime().filter(o => o.date === dateKey);
      if (existing.length > 0) {
        const old = existing[0];
        // Show custom modal instead of browser confirm
        showDuplicateModal(old, () => {
          // User confirmed - proceed with save
          proceedSave(dateKey, start, end, total, settings, cat, pay);
        });
        return;
      }

      proceedSave(dateKey, start, end, total, settings, cat, pay);
    }

    function proceedSave(dateKey, start, end, total, settings, cat, pay) {
      // Remove old entry if exists
      const data = getOvertime().filter(o => o.date !== dateKey);
      saveOvertime(data);

      const entry = {
        id: genId(),
        date: dateKey,
        startTime: start,
        endTime: end,
        totalHours: total,
        activity: document.getElementById('activity').value,
        project: document.getElementById('project').value,
        category: cat,
        baseSalary: settings.baseSalary,
        pay: pay,
        createdAt: new Date().toISOString()
      };

      const allData = getOvertime();
      allData.push(entry);
      saveOvertime(allData);
      showToast('Lembur berhasil disimpan', 'success');
      resetForm();
    }

    function showDuplicateModal(old, onConfirm) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `<div class="modal">
        <h2>Sudah Ada Lembur</h2>
        <p style="margin-bottom:12px;color:#475569;font-size:0.9rem;">
          Tanggal <strong>${formatDateDisplay(old.date)}</strong> sudah ada lembur:<br>
          <strong>${old.startTime} - ${old.endTime}</strong> (${old.totalHours.toFixed(1)} jam)${old.activity ? '<br>' + old.activity : ''}
        </p>
        <p style="margin-bottom:16px;color:#475569;font-size:0.9rem;">Timpa dengan data baru?</p>
        <div class="modal-actions">
          <button class="btn btn-outline" id="dupCancel">Batal</button>
          <button class="btn btn-primary" id="dupConfirm">Timpa</button>
        </div>
      </div>`;
      document.body.appendChild(overlay);
      document.getElementById('dupCancel').onclick = () => overlay.remove();
      document.getElementById('dupConfirm').onclick = () => { overlay.remove(); onConfirm(); };
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    function resetForm() {
      document.getElementById('form-lembur').reset();
      document.getElementById('totalHours').value = '';
      document.getElementById('payEstimate').value = '';
    }

    // No employee needed - single user
    // Set today's date
    document.getElementById('date').value = new Date().toISOString().slice(0,10);
  </script>
</body>
</html>
