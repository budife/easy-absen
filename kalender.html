<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Absen — Kalender Lembur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=17">
  <script src="libs/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">Easy Absen</div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Ringkasan</a></li>
        <li><a href="input.html">Catat Lembur</a></li>
        <li><a href="kalender.html">Kalender</a></li>
        <li><a href="riwayat.html">Riwayat</a></li>
        <li><a href="import.html">Import/Export</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </aside>
    <main class="main">
      <div class="page-header"><h1>Kalender Lembur</h1></div>

      <div class="cal-toolbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="cal-nav">
            <button class="btn btn-outline btn-sm" onclick="prevPeriod()">&laquo;</button>
            <button class="btn btn-outline btn-sm" onclick="goToday()">Hari Ini</button>
            <button class="btn btn-outline btn-sm" onclick="nextPeriod()">&raquo;</button>
          </div>
          <h2 id="periodLabel" style="font-size:1.1rem;font-weight:600;"></h2>
        </div>
        <div class="cal-view-btns">
          <button class="btn btn-sm" id="btnMonth" onclick="setView('month')">Bulan</button>
          <button class="btn btn-sm" id="btnWeek" onclick="setView('week')">Minggu</button>
        </div>
      </div>

      <div class="cal-stats" id="calStats"></div>

      <div id="calendarContainer"></div>

      <div class="day-panel" id="dayPanel"></div>
    </main>
  </div>

  <style>
    @media (max-width: 768px) {
      .cal-grid, .week-grid { font-size: 0.7rem; }
      .cal-day { min-height: 60px; padding: 2px; }
      .cal-day-name { font-size: 0.6rem; padding: 4px 2px; }
      .cal-event { font-size: 0.55rem; padding: 1px 2px; }
      .week-grid { grid-template-columns: 40px repeat(7, 1fr); }
      .week-time { font-size: 0.6rem; padding: 2px 4px; }
      .week-cell { min-height: 30px; }
      .day-num { font-size: 0.7rem; }
      .cal-toolbar { flex-direction: column; align-items: flex-start; }
      .cal-view-btns { width: 100%; }
      .cal-view-btns .btn { flex: 1; }
      .main { padding: 16px; }
    }
    @media (max-width: 480px) {
      .cal-day { min-height: 50px; }
      .cal-event { display: none; }
      .cal-day.has-ot::after { content: '•'; color: var(--accent); font-size: 1rem; position: absolute; bottom: 2px; right: 4px; }
    }
  </style>
  <script src="js/app.js"></script>
  <script>
    let viewMode = 'month';
    let currentDate = new Date();
    const catLabels = { weekday: 'Hari Kerja', weekend: 'Akhir Pekan', holiday: 'Libur' };
    const catClass = { weekday: 'cat-weekday', weekend: 'cat-weekend', holiday: 'cat-holiday' };

    function setView(mode) {
      viewMode = mode;
      document.getElementById('btnMonth').classList.toggle('active', mode === 'month');
      document.getElementById('btnWeek').classList.toggle('active', mode === 'week');
      render();
    }

    function prevPeriod() {
      if (viewMode === 'month') currentDate.setMonth(currentDate.getMonth() - 1);
      else currentDate.setDate(currentDate.getDate() - 7);
      render();
    }

    function nextPeriod() {
      if (viewMode === 'month') currentDate.setMonth(currentDate.getMonth() + 1);
      else currentDate.setDate(currentDate.getDate() + 7);
      render();
    }

    function goToday() {
      currentDate = new Date();
      render();
    }

    function render() {
      if (viewMode === 'month') renderMonth();
      else renderWeek();
      updateStats();
    }

    function renderMonth() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('periodLabel').textContent = currentDate.toLocaleString('id-ID', { month: 'long', year: 'numeric' });

      const overtime = getOvertime();
      const byDate = {};
      overtime.forEach(o => { if (!byDate[o.date]) byDate[o.date] = []; byDate[o.date].push(o); });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();
      const todayKey = new Date().getFullYear() + String(new Date().getMonth()+1).padStart(2,'0') + String(new Date().getDate()).padStart(2,'0');

      let html = '<div class="cal-grid">';
      ['Min','Sen','Sel','Rab','Kam','Jum','Sab'].forEach(d => { html += `<div class="cal-day-name">${d}</div>`; });

      for (let i = firstDay - 1; i >= 0; i--) {
        html += `<div class="cal-day other-month"><div class="day-num">${daysInPrevMonth - i}</div></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateKey = year + String(month+1).padStart(2,'0') + String(d).padStart(2,'0');
        const entries = byDate[dateKey] || [];
        const isToday = dateKey === todayKey;
        let cls = 'cal-day';
        if (isToday) cls += ' today';
        if (entries.length) cls += ' has-ot';

        html += `<div class="${cls}" onclick="showDay('${dateKey}')"><div class="day-num">${d}</div>`;
        entries.slice(0, 3).forEach(e => {
          html += `<div class="cal-event ${catClass[e.category]}" title="${e.activity || ''}">${e.startTime}-${e.endTime} ${e.activity ? e.activity.slice(0,12) : ''}</div>`;
        });
        if (entries.length > 3) html += `<div class="cal-more">+${entries.length - 3} lainnya</div>`;
        html += '</div>';
      }

      const totalCells = firstDay + daysInMonth;
      const remaining = (7 - (totalCells % 7)) % 7;
      for (let d = 1; d <= remaining; d++) {
        html += `<div class="cal-day other-month"><div class="day-num">${d}</div></div>`;
      }
      html += '</div>';
      document.getElementById('calendarContainer').innerHTML = html;
    }

    function renderWeek() {
      const overtime = getOvertime();
      const byDate = {};
      overtime.forEach(o => { if (!byDate[o.date]) byDate[o.date] = []; byDate[o.date].push(o); });

      const d = new Date(currentDate);
      d.setDate(d.getDate() - d.getDay());
      const todayKey = new Date().getFullYear() + String(new Date().getMonth()+1).padStart(2,'0') + String(new Date().getDate()).padStart(2,'0');

      const endDate = new Date(d); endDate.setDate(endDate.getDate() + 6);
      document.getElementById('periodLabel').textContent =
        d.toLocaleString('id-ID', { day: 'numeric', month: 'short' }) + ' - ' +
        endDate.toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });

      let html = '<div class="week-grid">';
      html += '<div class="week-header" style="background:var(--bg-subtle);"></div>';
      for (let i = 0; i < 7; i++) {
        const day = new Date(d); day.setDate(day.getDate() + i);
        const dateKey = day.getFullYear() + String(day.getMonth()+1).padStart(2,'0') + String(day.getDate()).padStart(2,'0');
        const isToday = dateKey === todayKey;
        html += `<div class="week-header${isToday ? ' today' : ''}">
          <div class="day-name">${day.toLocaleString('id-ID', { weekday: 'short' })}</div>
          <div class="day-num">${day.getDate()}</div>
        </div>`;
      }

      for (let h = 6; h <= 23; h++) {
        html += `<div class="week-time">${String(h).padStart(2,'0')}:00</div>`;
        for (let i = 0; i < 7; i++) {
          const day = new Date(d); day.setDate(day.getDate() + i);
          const dateKey = day.getFullYear() + String(day.getMonth()+1).padStart(2,'0') + String(day.getDate()).padStart(2,'0');
          const isToday = dateKey === todayKey;
          const entries = (byDate[dateKey] || []).filter(e => parseInt(e.startTime.split(':')[0]) === h);
          html += `<div class="week-cell${isToday ? ' today' : ''}">`;
          entries.forEach(e => {
            html += `<div class="week-event ${catClass[e.category]}" onclick="showDay('${dateKey}')" title="${e.activity || ''}">${e.startTime}-${e.endTime}</div>`;
          });
          html += '</div>';
        }
      }
      html += '</div>';
      document.getElementById('calendarContainer').innerHTML = html;
    }

    function showDay(dateKey) {
      const entries = getOvertime().filter(o => o.date === dateKey);
      const panel = document.getElementById('dayPanel');
      if (entries.length === 0) {
        panel.innerHTML = `<div class="card"><p style="color:var(--text-muted);font-size:0.875rem;">Tidak ada lembur pada ${formatDateDisplay(dateKey)}</p></div>`;
        return;
      }
      const totalH = entries.reduce((s,e) => s + (e.totalHours||0), 0);
      const totalPay = entries.reduce((s,e) => s + (e.pay||0), 0);
      let html = `<div class="card"><div class="day-panel-header"><h3>${formatDateDisplay(dateKey)}</h3>
        <span style="font-size:0.8rem;color:var(--text-muted);">${entries.length} lembur · ${totalH.toFixed(1)} jam${totalPay ? ' · Rp ' + totalPay.toLocaleString('id-ID') : ''}</span></div>`;
      entries.forEach(e => {
        html += `<div class="day-event-card">
          <div class="event-time">${e.startTime} — ${e.endTime} (${(e.totalHours||0).toFixed(2)} jam)</div>
          <div class="event-title">${e.activity || 'Tanpa deskripsi'}</div>
          <div class="event-meta">${e.project ? 'Project: ' + e.project + ' · ' : ''}${catLabels[e.category] || e.category}</div>
          ${e.pay ? `<div class="event-pay">Rp ${e.pay.toLocaleString('id-ID')}</div>` : ''}
        </div>`;
      });
      html += '</div>';
      panel.innerHTML = html;
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function updateStats() {
      const overtime = getOvertime();
      if (viewMode === 'week') {
        const d = new Date(currentDate); d.setDate(d.getDate() - d.getDay());
        const weekStart = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
        d.setDate(d.getDate() + 6);
        const weekEnd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
        const we = overtime.filter(o => o.date >= weekStart && o.date <= weekEnd);
        const th = we.reduce((s,e) => s + (e.totalHours||0), 0);
        const tp = we.reduce((s,e) => s + (e.pay||0), 0);
        document.getElementById('calStats').innerHTML =
          `<span class="cal-stat">Minggu ini: <strong>${we.length}</strong> lembur</span>` +
          `<span class="cal-stat">Total: <strong>${th.toFixed(1)}</strong> jam</span>` +
          (tp ? `<span class="cal-stat">Uang: <strong>Rp ${tp.toLocaleString('id-ID')}</strong></span>` : '');
        return;
      }
      const monthKey = currentDate.getFullYear() + String(currentDate.getMonth()+1).padStart(2,'0');
      const me = overtime.filter(o => o.date && o.date.slice(0,6) === monthKey);
      const th = me.reduce((s,e) => s + (e.totalHours||0), 0);
      const tp = me.reduce((s,e) => s + (e.pay||0), 0);
      const days = new Set(me.map(o => o.date)).size;
      document.getElementById('calStats').innerHTML =
        `<span class="cal-stat">Bulan ini: <strong>${me.length}</strong> lembur</span>` +
        `<span class="cal-stat">Total: <strong>${th.toFixed(1)}</strong> jam</span>` +
        `<span class="cal-stat">Hari: <strong>${days}</strong></span>` +
        (tp ? `<span class="cal-stat">Uang: <strong>Rp ${tp.toLocaleString('id-ID')}</strong></span>` : '');
    }

    document.getElementById('btnMonth').classList.add('active');
    render();
  </script>
</body>
</html>
