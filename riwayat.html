<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Absen — Riwayat Lembur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=17">
  <script src="libs/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">Easy <span>Absen</span></div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Ringkasan</a></li>
        <li><a href="input.html">Catat Lembur</a></li>
        <li><a href="kalender.html">Kalender</a></li>
        <li><a href="riwayat.html">Riwayat</a></li>
        <li><a href="import.html">Import/Export</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </aside>
    <main class="main">
      <div class="page-header">
        <h1>Riwayat Lembur</h1>
        <button class="btn btn-success btn-sm" onclick="exportFiltered()">Export Filtered</button>
      </div>

      <div class="filter-bar">
        <input type="date" id="filterDateFrom" class="form-control" placeholder="Dari">
        <input type="date" id="filterDateTo" class="form-control" placeholder="Sampai">
        <select id="filterCat" class="form-control">
          <option value="">Semua Kategori</option>
          <option value="weekday">Hari Kerja</option>
          <option value="weekend">Akhir Pekan</option>
          <option value="holiday">Libur</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="renderTable()">Filter</button>
        <button class="btn btn-outline btn-sm" onclick="clearFilter()">Reset</button>
      </div>

      <div class="card">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Tanggal</th>
                <th>Jam</th>
                <th>Total</th>
                <th>Aktivitas</th>
                <th>Project</th>
                <th>Kategori</th>
                <th>Uang</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="pagination" style="margin-top:12px;display:flex;gap:8px;justify-content:center;"></div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    let currentPage = 1;
    const perPage = 20;

    function loadFilterEmps() {}

    function getFiltered() {
      const from = document.getElementById('filterDateFrom').value;
      const to = document.getElementById('filterDateTo').value;
      const cat = document.getElementById('filterCat').value;

      let data = getOvertime();
      if (from) data = data.filter(o => o.date >= formatDateYYYYMMDD(from));
      if (to) data = data.filter(o => o.date <= formatDateYYYYMMDD(to));
      if (cat) data = data.filter(o => o.category === cat);

      data.sort((a,b) => b.date.localeCompare(a.date) || b.startTime.localeCompare(a.startTime));
      return data;
    }

    function renderTable() {
      const data = getFiltered();
      const totalPages = Math.ceil(data.length / perPage) || 1;
      if (currentPage > totalPages) currentPage = 1;
      const start = (currentPage - 1) * perPage;
      const pageData = data.slice(start, start + perPage);

      const catLabels = { weekday: 'Hari Kerja', weekend: 'Akhir Pekan', holiday: 'Libur' };
      const catClass = { weekday: 'badge-weekday', weekend: 'badge-weekend', holiday: 'badge-holiday' };

      document.getElementById('tbody').innerHTML = pageData.length
        ? pageData.map(o => {
            return `<tr>
              <td>${formatDateDisplay(o.date)}</td>
              <td>${o.startTime}-${o.endTime}</td>
              <td>${(o.totalHours||0).toFixed(2)}</td>
              <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${o.activity||'-'}</td>
              <td>${o.project||'-'}</td>
              <td><span class="badge ${catClass[o.category]}">${catLabels[o.category]||o.category}</span></td>
              <td>${o.pay ? 'Rp '+o.pay.toLocaleString('id-ID') : '-'}</td>
              <td>
                <button class="btn btn-outline btn-sm" onclick="editEntry('${o.id}')">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteEntry('${o.id}')">Hapus</button>
              </td>
            </tr>`;
          }).join('')
        : '<tr><td colspan="8" class="empty-state">Belum ada data lembur</td></tr>';

      // Pagination
      let pagHtml = '';
      if (totalPages > 1) {
        for (let i = 1; i <= totalPages; i++) {
          pagHtml += `<button class="btn btn-sm ${i===currentPage?'btn-primary':'btn-outline'}" onclick="goPage(${i})">${i}</button>`;
        }
      }
      document.getElementById('pagination').innerHTML = pagHtml;
    }

    function goPage(p) { currentPage = p; renderTable(); }

    function clearFilter() {
      document.getElementById('filterDateFrom').value = '';
      document.getElementById('filterDateTo').value = '';
      document.getElementById('filterEmp').value = '';
      document.getElementById('filterCat').value = '';
      currentPage = 1;
      renderTable();
    }

    function deleteEntry(id) {
      if (!confirm('Hapus lembur ini?')) return;
      const data = getOvertime().filter(o => o.id !== id);
      saveOvertime(data);
      showToast('Dihapus', 'success');
      renderTable();
    }

    function editEntry(id) {
      const entry = getOvertime().find(o => o.id === id);
      if (!entry) return;
      const modal = showModal(`
        <h2>Edit Lembur</h2>
        <div class="form-group"><label>Tanggal</label><input type="date" id="e-date" class="form-control" value="${formatDateDisplay(entry.date)}"></div>
        <div class="form-row">
          <div class="form-group"><label>Jam Mulai</label><input type="time" id="e-start" class="form-control" value="${entry.startTime}"></div>
          <div class="form-group"><label>Jam Selesai</label><input type="time" id="e-end" class="form-control" value="${entry.endTime}"></div>
        </div>
        <div class="form-group"><label>Aktivitas</label><textarea id="e-activity" class="form-control" rows="3">${entry.activity||''}</textarea></div>
        <div class="form-row">
          <div class="form-group"><label>Project</label><input type="text" id="e-project" class="form-control" value="${entry.project||''}"></div>
          <div class="form-group"><label>Kategori</label>
            <select id="e-cat" class="form-control">
              <option value="weekday" ${entry.category==='weekday'?'selected':''}>Hari Kerja</option>
              <option value="weekend" ${entry.category==='weekend'?'selected':''}>Akhir Pekan</option>
              <option value="holiday" ${entry.category==='holiday'?'selected':''}>Libur</option>
            </select>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="closeModal()">Batal</button>
          <button class="btn btn-primary" onclick="saveEdit('${id}')">Simpan</button>
        </div>
      `);
    }

    function saveEdit(id) {
      const data = getOvertime();
      const idx = data.findIndex(o => o.id === id);
      if (idx === -1) return;
      const start = document.getElementById('e-start').value;
      const end = document.getElementById('e-end').value;
      const total = calcTotalHours(start, end);
      const cat = document.getElementById('e-cat').value;
      const settings = getSettings();
      data[idx].date = formatDateYYYYMMDD(document.getElementById('e-date').value);
      data[idx].startTime = start;
      data[idx].endTime = end;
      data[idx].totalHours = total;
      data[idx].activity = document.getElementById('e-activity').value;
      data[idx].project = document.getElementById('e-project').value;
      data[idx].category = cat;
      data[idx].pay = calcOvertimePay(total, cat, settings.baseSalary);
      saveOvertime(data);
      closeModal();
      showToast('Diupdate', 'success');
      renderTable();
    }

    function exportFiltered() {
      const data = getFiltered();
      const exportData = prepareExportDataSimple(data);
      exportToXlsx(exportData, 'lembur-filtered-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '.xlsx');
      showToast('Exported', 'success');
    }

    loadFilterEmps();
    renderTable();
  </script>
</body>
</html>
