<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Absen — Input Lembur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="libs/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">Easy <span>Absen</span></div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="input.html">Input Lembur</a></li>
        <li><a href="kalender.html">Kalender</a></li>
        <li><a href="riwayat.html">Riwayat</a></li>
        <li><a href="import.html">Import/Export</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </aside>
    <main class="main">
      <div class="page-header"><h1>Input Lembur</h1></div>

      <div class="card">
        <form id="form-lembur" onsubmit="submitLembur(event)">
          <!-- Quick time presets -->
          <div style="margin-bottom:16px;">
            <label style="font-size:0.85rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:8px;">Jam Cepat</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button type="button" class="btn btn-outline btn-sm" onclick="setTimePreset(18,0,3)">18:00 → 21:00 (3j)</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setTimePreset(18,0,2)">18:00 → 20:00 (2j)</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setTimePreset(19,0,3)">19:00 → 22:00 (3j)</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setTimePreset(20,0,2)">20:00 → 22:00 (2j)</button>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Tanggal</label>
              <input type="date" id="date" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Kategori</label>
              <select id="category" class="form-control">
                <option value="weekday">Hari Kerja</option>
                <option value="weekend">Akhir Pekan</option>
                <option value="holiday">Libur</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Jam Mulai</label>
              <input type="time" id="startTime" class="form-control" required onchange="updateTotal()">
            </div>
            <div class="form-group">
              <label>Jam Selesai</label>
              <input type="time" id="endTime" class="form-control" required onchange="updateTotal()">
            </div>
          </div>

          <!-- Duration quick buttons -->
          <div style="margin-bottom:16px;">
            <label style="font-size:0.85rem;font-weight:600;color:var(--text-muted);display:block;margin-bottom:8px;">Durasi Cepat (dari jam mulai)</label>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button type="button" class="btn btn-outline btn-sm" onclick="setDuration(1)">+1 jam</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setDuration(2)">+2 jam</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setDuration(3)">+3 jam</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setDuration(4)">+4 jam</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="setDuration(5)">+5 jam</button>
            </div>
          </div>

          <div class="form-group">
            <label>Total Jam</label>
            <input type="text" id="totalHours" class="form-control" readonly style="background:var(--bg);font-size:1.2rem;font-weight:700;text-align:center;">
          </div>
          <div class="form-group">
            <label>Aktivitas / Deskripsi</label>
            <textarea id="activity" class="form-control" rows="2" placeholder="Apa yang dikerjakan..."></textarea>
          </div>
          <div class="form-group">
            <label>Project</label>
            <input type="text" id="project" class="form-control" placeholder="Nama project">
          </div>
          <div class="form-group">
            <label>Estimasi Uang Lembur</label>
            <input type="text" id="payEstimate" class="form-control" readonly style="background:var(--bg);font-weight:600;">
          </div>
          <div style="display:flex;gap:8px;">
            <button type="submit" class="btn btn-primary">Simpan Lembur</button>
            <button type="button" class="btn btn-outline" onclick="resetForm()">Reset</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    function loadEmployees() {
      ensureDefaultEmployee();
    }

    function setTimePreset(startH, startM, durH) {
      const start = String(startH).padStart(2,'0') + ':' + String(startM).padStart(2,'0');
      const endMin = startH * 60 + startM + durH * 60;
      const endH = Math.floor(endMin / 60) % 24;
      const endM = endMin % 60;
      const end = String(endH).padStart(2,'0') + ':' + String(endM).padStart(2,'0');
      document.getElementById('startTime').value = start;
      document.getElementById('endTime').value = end;
      updateTotal();
    }

    function setDuration(hours) {
      const start = document.getElementById('startTime').value;
      if (!start) { showToast('Set jam mulai dulu', 'error'); return; }
      const [h, m] = start.split(':').map(Number);
      const endMin = h * 60 + (m||0) + hours * 60;
      const endH = Math.floor(endMin / 60) % 24;
      const endM = endMin % 60;
      document.getElementById('endTime').value = String(endH).padStart(2,'0') + ':' + String(endM).padStart(2,'0');
      updateTotal();
    }

    function updateTotal() {
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const total = calcTotalHours(start, end);
      document.getElementById('totalHours').value = total > 0 ? total.toFixed(2) + ' jam' : '';
      updatePayEstimate();
    }

    function updatePayEstimate() {
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const total = calcTotalHours(start, end);
      const cat = document.getElementById('category').value;
      const settings = getSettings();
      const pay = calcOvertimePay(total, cat, settings.baseSalary);
      document.getElementById('payEstimate').value = pay > 0 ? 'Rp ' + pay.toLocaleString('id-ID') : '';
    }

    document.getElementById('category').addEventListener('change', updatePayEstimate);
    document.getElementById('startTime').addEventListener('change', updateTotal);
    document.getElementById('endTime').addEventListener('change', updateTotal);

    function submitLembur(e) {
      e.preventDefault();
      const dateVal = document.getElementById('date').value;
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const total = calcTotalHours(start, end);

      if (total <= 0) {
        showToast('Jam selesai harus lebih dari jam mulai', 'error');
        return;
      }

      const settings = getSettings();
      const cat = document.getElementById('category').value;
      const pay = calcOvertimePay(total, cat, settings.baseSalary);

      const entry = {
        id: genId(),
        date: formatDateYYYYMMDD(dateVal),
        startTime: start,
        endTime: end,
        totalHours: total,
        activity: document.getElementById('activity').value,
        project: document.getElementById('project').value,
        category: cat,
        baseSalary: settings.baseSalary,
        pay: pay,
        createdAt: new Date().toISOString()
      };

      const data = getOvertime();
      data.push(entry);
      saveOvertime(data);
      showToast('Lembur berhasil disimpan', 'success');
      resetForm();
    }

    function resetForm() {
      document.getElementById('form-lembur').reset();
      document.getElementById('totalHours').value = '';
      document.getElementById('payEstimate').value = '';
    }

    // No employee needed - single user
    // Set today's date
    document.getElementById('date').value = new Date().toISOString().slice(0,10);
  </script>
</body>
</html>
