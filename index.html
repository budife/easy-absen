<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lemboor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=31">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c6f5b">
  <script src="libs/xlsx.full.min.js"></script>
  <style>
    .view { display: none; }
    .view.active { display: block; }
    .sidebar-nav a { cursor: pointer; }
  
/* Nav icons */
.nav-icon { font-size: 1.1rem; line-height: 1; }
.nav-label { font-size: 0.7rem; }
@media (min-width: 769px) {
  .nav-icon { display: none; }
  .nav-label { font-size: 14px; }
  .sidebar-nav li a { flex-direction: row; gap: 0; }
}
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">Lemboor</div>
      <ul class="sidebar-nav">
        <li><a href="#ringkasan" data-view="ringkasan"><span class="nav-icon">📊</span><span class="nav-label">Ringkasan</span></a></li>
        <li><a href="#catat" data-view="catat"><span class="nav-icon">✏️</span><span class="nav-label">Catat</span></a></li>
        <li><a href="#kalender" data-view="kalender"><span class="nav-icon">📅</span><span class="nav-label">Kalender</span></a></li>
        <li><a href="#riwayat" data-view="riwayat"><span class="nav-icon">📋</span><span class="nav-label">Riwayat</span></a></li>
        <li><a href="#import" data-view="import"><span class="nav-icon">📁</span><span class="nav-label">Import</span></a></li>
        <li><a href="#settings" data-view="settings"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></a></li>
      </ul>
    </aside>
    <main class="main" id="mainContent">
      <!-- Views injected here -->
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
  // SPA Router
  const views = {};
  let currentView = null;

  function registerView(name, renderFn) {
    views[name] = renderFn;
  }

  function navigateTo(viewName) {
    if (!views[viewName]) viewName = 'ringkasan';
    // Hide all views
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    // Show target view
    let viewEl = document.getElementById('view-' + viewName);
    if (!viewEl) {
      viewEl = document.createElement('div');
      viewEl.id = 'view-' + viewName;
      viewEl.className = 'view';
      document.getElementById('mainContent').appendChild(viewEl);
    }
    viewEl.classList.add('active');
    // Update sidebar active
    document.querySelectorAll('.sidebar-nav a').forEach(a => {
      a.classList.toggle('active', a.dataset.view === viewName);
    });
    // Update title
    const titles = { ringkasan: 'Ringkasan', catat: 'Catat Lembur', kalender: 'Kalender Lembur', riwayat: 'Riwayat Lembur', import: 'Import/Export', settings: 'Settings' };
    document.title = 'Lemboor — ' + (titles[viewName] || viewName);
    // Render view content
    if (views[viewName]) views[viewName](viewEl);
    currentView = viewName;
    // Scroll to top
    window.scrollTo(0, 0);
  }

  // Handle hash changes
  window.addEventListener('hashchange', () => {
    const hash = location.hash.replace('#', '') || 'ringkasan';
    navigateTo(hash);
  });

  // Initial load handled after views are registered (see bottom of page)
  </script>

  <!-- View: Ringkasan -->
  <script>
  registerView('ringkasan', function(container) {
    container.innerHTML = `
      <div class="page-header">
        <h1>Ringkasan</h1>
        <button class="btn btn-primary" onclick="navigateTo('catat')">+ Catat Lembur</button>
      </div>
      <div class="card-grid" id="stats"></div>
      <div class="card">
        <h3 style="margin-bottom:12px;">Lembur per Bulan</h3>
        <div id="chart-monthly"></div>
      </div>
      <div class="card" style="margin-top:24px;">
        <h3 style="margin-bottom:12px;">Distribusi Kategori</h3>
        <div id="chart-category"></div>
      </div>
    `;
    renderDashboard();
  });
  </script>

  <!-- View: Catat Lembur -->
  <script>
  registerView('catat', function(container) {
    container.innerHTML = `
      <div class="page-header"><h1>Catat Lembur</h1></div>
      <div class="card">
        <form id="overtimeForm">
          <div class="form-row">
            <div class="form-group">
              <label>Tanggal</label>
              <input type="date" class="form-control" id="date" required>
            </div>
            <div class="form-group">
              <label>Kategori</label>
              <select class="form-control" id="category">
                <option value="weekday">Hari Kerja</option>
                <option value="weekend">Akhir Pekan</option>
                <option value="holiday">Libur</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Jam Mulai</label>
              <input type="time" class="form-control" id="startTime" required>
            </div>
            <div class="form-group">
              <label>Jam Selesai</label>
              <input type="time" class="form-control" id="endTime" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Aktivitas / Deskripsi</label>
              <input type="text" class="form-control" id="activity" placeholder="Deskripsi pekerjaan">
            </div>
            <div class="form-group">
              <label>Project (opsional)</label>
              <input type="text" class="form-control" id="project" placeholder="Nama project">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Rate per Jam (Rp)</label>
              <input type="number" class="form-control" id="rate" placeholder="0">
            </div>
            <div class="form-group">
              <label>Total Jam</label>
              <input type="text" class="form-control" id="totalHours" readonly>
            </div>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px;">
            <button type="button" class="btn btn-outline" onclick="resetForm()">Reset</button>
            <button type="submit" class="btn btn-primary">Simpan</button>
          </div>
        </form>
      </div>
    `;
    initInputForm();
  });
  </script>

  <!-- View: Kalender -->
  <script>
  registerView('kalender', function(container) {
    container.innerHTML = `
      <div class="page-header"><h1>Kalender Lembur</h1></div>
      <div class="cal-toolbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="cal-nav">
            <button class="btn btn-outline btn-sm" onclick="prevPeriod()">&laquo;</button>
            <button class="btn btn-outline btn-sm" onclick="goToday()">Hari Ini</button>
            <button class="btn btn-outline btn-sm" onclick="nextPeriod()">&raquo;</button>
          </div>
          <h2 id="periodLabel" style="font-size:1.1rem;font-weight:600;"></h2>
        </div>
        <div class="cal-view-btns">
          <button class="btn btn-sm" id="btnMonth" onclick="setView('month')">Bulan</button>
          <button class="btn btn-sm" id="btnWeek" onclick="setView('week')">Minggu</button>
        </div>
      </div>
      <div class="cal-stats" id="calStats"></div>
      <div id="calendarContainer"></div>
      <div class="day-panel" id="dayPanel"></div>
    `;
    setView('month');
  });
  </script>

  <!-- View: Riwayat -->
  <script>
  registerView('riwayat', function(container) {
    container.innerHTML = `
      <div class="page-header"><h1>Riwayat Lembur</h1></div>
      <div class="filter-bar">
        <select class="form-control" id="filterMonth" onchange="renderRiwayat()"></select>
        <select class="form-control" id="filterCat" onchange="renderRiwayat()">
          <option value="">Semua Kategori</option>
          <option value="weekday">Hari Kerja</option>
          <option value="weekend">Akhir Pekan</option>
          <option value="holiday">Libur</option>
        </select>

      </div>
      <div class="card">
        <div class="table-container">
          <table>
            <thead><tr>
              <th>Tanggal</th><th>Jam</th><th>Total</th><th>Kategori</th><th>Aktivitas</th><th>Project</th><th>Uang</th><th></th>
            </tr></thead>
            <tbody id="riwayatBody"></tbody>
          </table>
        </div>
        <div id="riwayatPag" style="margin-top:12px;display:flex;gap:4px;justify-content:center;flex-wrap:wrap;"></div>

  <!-- View: Import/Export -->
  <script>
  registerView('import', function(container) {
    container.innerHTML = `
      <div class="page-header"><h1>Import / Export</h1></div>
      <div class="card" style="margin-bottom:16px;">
        <h3 style="margin-bottom:12px;">Export Data</h3>
        <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:12px;">Download semua data lembur ke file Excel.</p>
        <button class="btn btn-primary" onclick="exportBackup()">Export XLSX</button>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <h3 style="margin-bottom:12px;">Import Data</h3>
        <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:12px;">Upload file Excel untuk import data lembur.</p>
        <input type="file" id="importFile" accept=".xlsx,.xls" class="form-control" style="margin-bottom:12px;">
        <button class="btn btn-outline" onclick="importData()">Import</button>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px;">Backup / Restore</h3>
        <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:12px;">Simpan atau pulihkan data ke file JSON.</p>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-outline" onclick="exportJson()">Export JSON</button>
          <button class="btn btn-outline" onclick="document.getElementById('importJsonFile').click()">Import JSON</button>
          <input type="file" id="importJsonFile" accept=".json" style="display:none;" onchange="importJson(event)">

  <!-- View: Settings -->
  <script>
  registerView('settings', function(container) {
    container.innerHTML = `
      <div class="page-header"><h1>Settings</h1></div>
      <div class="card">
        <div class="form-group">
          <label>Rate Default (Rp/jam)</label>
          <input type="number" class="form-control" id="defaultRate" placeholder="0">
        </div>
        <div class="form-group">
          <label>Nama</label>
          <input type="text" class="form-control" id="userName" placeholder="Nama Anda">
        </div>
        <button class="btn btn-primary" onclick="saveSettings()">Simpan</button>
      </div>
      <div class="card" style="margin-top:16px;">
        <h3 style="margin-bottom:12px;color:var(--danger);">Zona Berbahaya</h3>
        <p style="color:var(--text-muted);font-size:0.875rem;margin-bottom:12px;">Hapus semua data lembur.</p>
        <button class="btn btn-danger" onclick="clearAllData()">Hapus Semua Data</button>
      </div>

  <!-- Page-specific logic -->
  <script>
  // --- Dashboard ---
  function renderDashboard() {
    const overtime = getOvertime();
    const settings = getSettings();
    const now = new Date();
    const currentMonth = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0');
    const thisMonth = overtime.filter(o => o.date && o.date.slice(0,6) === currentMonth);
    const totalHours = thisMonth.reduce((s,o) => s + (o.totalHours||0), 0);
    document.getElementById('stats').innerHTML = `
      <div class="card stat-card"><div class="value">${totalHours.toFixed(1)}</div><div class="label">Total Jam Bulan Ini</div></div>
      <div class="card stat-card"><div class="value">${thisMonth.length}</div><div class="label">Jumlah Lemboor</div></div>
      <div class="card stat-card"><div class="value">${totalHours > 0 ? (totalHours / thisMonth.length).toFixed(1) : 0}</div><div class="label">Rata-rata Jam</div></div>
      <div class="card stat-card"><div class="value">${thisMonth.reduce((s,o) => s + (o.pay||0), 0).toLocaleString('id-ID')}</div><div class="label">Total Uang Lemboor</div></div>
    `;
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0');
      const label = d.toLocaleString('id-ID', { month: 'short', year: '2-digit' });
      const hours = overtime.filter(o => o.date && o.date.slice(0,6) === key).reduce((s,o) => s + (o.totalHours||0), 0);
      months.push({ label, hours });
    }
    const maxH = Math.max(...months.map(m => m.hours), 1);
    const hasData = months.some(m => m.hours > 0);
    document.getElementById('chart-monthly').innerHTML = hasData ? months.map(m => `
      <div class="chart-bar">
        <div class="label">${m.label}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(m.hours/maxH*100)}%"></div></div>
        <div class="value">${m.hours.toFixed(1)}j</div>
      </div>
    `).join('') : '<div class="empty-state">Belum ada data lembur. Catat lembur pertama Anda!</div>';
    const cats = { weekday: 0, weekend: 0, holiday: 0 };
    thisMonth.forEach(o => { cats[o.category] = (cats[o.category]||0) + (o.totalHours||0); });
    const catTotal = Object.values(cats).reduce((a,b) => a+b, 0) || 1;
    const catLabels = { weekday: 'Hari Kerja', weekend: 'Akhir Pekan', holiday: 'Libur' };
    const hasCatData = Object.values(cats).some(v => v > 0);
    document.getElementById('chart-category').innerHTML = hasCatData ? Object.entries(cats).map(([k,v]) => `
      <div class="chart-bar">
        <div class="label">${catLabels[k]}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(v/catTotal*100)}%;background:${k==='weekday'?'#2563eb':k==='weekend'?'#f59e0b':'#ec4899'}"></div></div>
        <div class="value">${v.toFixed(1)}j</div>
      </div>
    `).join('') : '<div class="empty-state">Belum ada data kategori bulan ini.</div>';
  }

  // --- Input Form ---
  function initInputForm() {
    // Restore draft
    const draft = localStorage.getItem('ea_draft');
    if (draft) {
      try {
        const d = JSON.parse(draft);
        if (d.date) document.getElementById('date').value = d.date;
        if (d.category) document.getElementById('category').value = d.category;
        if (d.startTime) document.getElementById('startTime').value = d.startTime;
        if (d.endTime) document.getElementById('endTime').value = d.endTime;
        if (d.activity) document.getElementById('activity').value = d.activity;
        if (d.project) document.getElementById('project').value = d.project;
        if (d.rate) document.getElementById('rate').value = d.rate;
        calcTotalHours();
      } catch(e) {}
    } else {
      document.getElementById('date').value = new Date().toISOString().slice(0,10);
    }
    // Auto-save draft on input
    ['date','category','startTime','endTime','activity','project','rate'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', saveDraft);
    });
    const form = document.getElementById('overtimeForm');
    if (form) {
      form.onsubmit = function(e) {
        e.preventDefault();
        const startTime = document.getElementById('startTime').value;
        const endTime = document.getElementById('endTime').value;
        const date = document.getElementById('date').value;
        // Validation
        if (!date) { toast('Tanggal harus diisi', 'error'); return; }
        if (!startTime || !endTime) { toast('Jam mulai dan selesai harus diisi', 'error'); return; }
        const [sh, sm] = startTime.split(':').map(Number);
        const [eh, em] = endTime.split(':').map(Number);
        let total = (eh + em/60) - (sh + sm/60);
        if (total < 0) total += 24;
        if (total === 0) { toast('Jam selesai harus berbeda dari jam mulai', 'error'); return; }
        if (total > 24) { toast('Durasi tidak valid', 'error'); return; }
        // Duplicate check
        const existing = getOvertime();
        const dup = existing.find(o => o.date === date.replace(/-/g,'') && o.startTime === startTime && o.endTime === endTime);
        if (dup) { toast('Lemboor dengan jam yang sama sudah ada', 'error'); return; }
        // Overlap check
        const sameDay = existing.filter(o => o.date === date.replace(/-/g,''));
        const overlap = sameDay.find(o => {
          const [os, oe] = [o.startTime, o.endTime].map(t => { const [h,m] = t.split(':').map(Number); return h + m/60; });
          const [ns, ne] = [startTime, endTime].map(t => { const [h,m] = t.split(':').map(Number); return h + m/60; });
          return ns < oe && ne > os;
        });
        if (overlap) { toast('Waktu bertabrakan dengan lembur lain pada tanggal yang sama', 'error'); return; }
        // Confirmation
        if (!confirm(`Simpan lembur ${startTime}-${endTime} pada ${date}?`)) return;
        const entry = {
          id: genId(),
          date: date.replace(/-/g,''),
          category: document.getElementById('category').value,
          startTime: startTime,
          endTime: endTime,
          activity: document.getElementById('activity').value,
          project: document.getElementById('project').value,
          rate: parseFloat(document.getElementById('rate').value) || 0,
          totalHours: total,
          pay: total * (parseFloat(document.getElementById('rate').value) || 0)
        };
        const data = getOvertime();
        data.push(entry);
        saveOvertime(data);
        localStorage.removeItem('ea_draft');
        toast('Lemboor berhasil dicatat', 'success');
        resetForm();
      };
    }
    // Auto-calc total hours
    ['startTime','endTime'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', calcTotalHours);
    });
  }
  function calcTotalHours() {
    const s = document.getElementById('startTime').value;
    const e = document.getElementById('endTime').value;
    if (!s || !e) return;
    const [sh,sm] = s.split(':').map(Number);
    const [eh,em] = e.split(':').map(Number);
    let total = (eh + em/60) - (sh + sm/60);
    if (total < 0) total += 24;
    document.getElementById('totalHours').value = total.toFixed(2);
  }
function saveDraft() {
  const draft = {
    date: document.getElementById('date').value,
    category: document.getElementById('category').value,
    startTime: document.getElementById('startTime').value,
    endTime: document.getElementById('endTime').value,
    activity: document.getElementById('activity').value,
    project: document.getElementById('project').value,
    rate: document.getElementById('rate').value
  };
  localStorage.setItem('ea_draft', JSON.stringify(draft));
}
  function resetForm() {
    document.getElementById('overtimeForm').reset();
    document.getElementById('date').value = new Date().toISOString().slice(0,10);
    document.getElementById('totalHours').value = '';
    localStorage.removeItem('ea_draft');
  }

  // --- Calendar ---
  let viewMode = 'month';
  let currentDate = new Date();
  const catLabels = { weekday: 'Hari Kerja', weekend: 'Akhir Pekan', holiday: 'Libur' };
  const catClass = { weekday: 'cat-weekday', weekend: 'cat-weekend', holiday: 'cat-holiday' };
  function setView(mode) {
    viewMode = mode;
    const btnM = document.getElementById('btnMonth');
    const btnW = document.getElementById('btnWeek');
    if (btnM) btnM.classList.toggle('active', mode === 'month');
    if (btnW) btnW.classList.toggle('active', mode === 'week');
    render();
  }
  function prevPeriod() {
    if (viewMode === 'month') currentDate.setMonth(currentDate.getMonth() - 1);
    else currentDate.setDate(currentDate.getDate() - 7);
    render();
  }
  function nextPeriod() {
    if (viewMode === 'month') currentDate.setMonth(currentDate.getMonth() + 1);
    else currentDate.setDate(currentDate.getDate() + 7);
    render();
  }
  function goToday() { currentDate = new Date(); render(); }
  function render() {
    if (viewMode === 'month') renderMonth(); else renderWeek();
    updateStats();
  }
  function renderMonth() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const pl = document.getElementById('periodLabel');
    if (pl) pl.textContent = currentDate.toLocaleString('id-ID', { month: 'long', year: 'numeric' });
    const overtime = getOvertime();
    const byDate = {};
    overtime.forEach(o => { if (!byDate[o.date]) byDate[o.date] = []; byDate[o.date].push(o); });
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    const todayKey = new Date().getFullYear() + String(new Date().getMonth()+1).padStart(2,'0') + String(new Date().getDate()).padStart(2,'0');
    let html = '<div class="cal-grid">';
    ['Min','Sen','Sel','Rab','Kam','Jum','Sab'].forEach(d => { html += `<div class="cal-day-name">${d}</div>`; });
    for (let i = firstDay - 1; i >= 0; i--) html += `<div class="cal-day other-month"><div class="day-num">${daysInPrevMonth - i}</div></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dateKey = year + String(month+1).padStart(2,'0') + String(d).padStart(2,'0');
      const entries = byDate[dateKey] || [];
      const isToday = dateKey === todayKey;
      let cls = 'cal-day';
      if (isToday) cls += ' today';
      if (entries.length) cls += ' has-ot';
      html += `<div class="${cls}" onclick="showDay('${dateKey}')"><div class="day-num">${d}</div>`;
      entries.slice(0, 3).forEach(e => {
        html += `<div class="cal-event ${catClass[e.category]}" title="${e.activity || ''}">${e.startTime}-${e.endTime} ${e.activity ? e.activity.slice(0,12) : ''}</div>`;
      });
      if (entries.length > 3) html += `<div class="cal-more">+${entries.length - 3} lainnya</div>`;
      html += '</div>';
    }
    const totalCells = firstDay + daysInMonth;
    const remaining = (7 - (totalCells % 7)) % 7;
    for (let d = 1; d <= remaining; d++) html += `<div class="cal-day other-month"><div class="day-num">${d}</div></div>`;
    html += '</div>';
    const cc = document.getElementById('calendarContainer');
    if (cc) cc.innerHTML = html;
  }
  function renderWeek() {
    const overtime = getOvertime();
    const byDate = {};
    overtime.forEach(o => { if (!byDate[o.date]) byDate[o.date] = []; byDate[o.date].push(o); });
    const d = new Date(currentDate);
    d.setDate(d.getDate() - d.getDay());
    const todayKey = new Date().getFullYear() + String(new Date().getMonth()+1).padStart(2,'0') + String(new Date().getDate()).padStart(2,'0');
    const endDate = new Date(d); endDate.setDate(endDate.getDate() + 6);
    const pl = document.getElementById('periodLabel');
    if (pl) pl.textContent = d.toLocaleString('id-ID', { day: 'numeric', month: 'short' }) + ' - ' + endDate.toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    let html = '<div class="week-grid">';
    html += '<div class="week-header" style="background:var(--bg-subtle);"></div>';
    for (let i = 0; i < 7; i++) {
      const day = new Date(d); day.setDate(day.getDate() + i);
      const dateKey = day.getFullYear() + String(day.getMonth()+1).padStart(2,'0') + String(day.getDate()).padStart(2,'0');
      const isToday = dateKey === todayKey;
      html += `<div class="week-header${isToday ? ' today' : ''}">
        <div class="day-name">${day.toLocaleString('id-ID', { weekday: 'short' })}</div>
        <div class="day-num">${day.getDate()}</div>
      </div>`;
    }
    for (let h = 6; h <= 23; h++) {
      html += `<div class="week-time">${String(h).padStart(2,'0')}:00</div>`;
      for (let i = 0; i < 7; i++) {
        const day = new Date(d); day.setDate(day.getDate() + i);
        const dateKey = day.getFullYear() + String(day.getMonth()+1).padStart(2,'0') + String(day.getDate()).padStart(2,'0');
        const isToday = dateKey === todayKey;
        const entries = (byDate[dateKey] || []).filter(e => parseInt(e.startTime.split(':')[0]) === h);
        html += `<div class="week-cell${isToday ? ' today' : ''}">`;
        entries.forEach(e => { html += `<div class="week-event ${catClass[e.category]}" onclick="showDay('${dateKey}')" title="${e.activity || ''}">${e.startTime}-${e.endTime}</div>`; });
        html += '</div>';
      }
    }
    html += '</div>';
    const cc = document.getElementById('calendarContainer');
    if (cc) cc.innerHTML = html;
  }
  function showDay(dateKey) {
    const entries = getOvertime().filter(o => o.date === dateKey);
    const panel = document.getElementById('dayPanel');
    if (!panel) return;
    if (entries.length === 0) {
      panel.innerHTML = `<div class="card"><p style="color:var(--text-muted);font-size:0.875rem;">Tidak ada lembur pada ${formatDateDisplay(dateKey)}</p></div>`;
      return;
    }
    const totalH = entries.reduce((s,e) => s + (e.totalHours||0), 0);
    const totalPay = entries.reduce((s,e) => s + (e.pay||0), 0);
    let html = `<div class="card"><div class="day-panel-header"><h3>${formatDateDisplay(dateKey)}</h3><span style="font-size:0.8rem;color:var(--text-muted);">${entries.length} lembur · ${totalH.toFixed(1)} jam${totalPay ? ' · Rp ' + totalPay.toLocaleString('id-ID') : ''}</span></div>`;
    entries.forEach(e => {
      html += `<div class="day-event-card">
        <div class="event-time">${e.startTime} — ${e.endTime} (${(e.totalHours||0).toFixed(2)} jam)</div>
        <div class="event-title">${e.activity || 'Tanpa deskripsi'}</div>
        <div class="event-meta">${e.project ? 'Project: ' + e.project + ' · ' : ''}${catLabels[e.category] || e.category}</div>
        ${e.pay ? `<div class="event-pay">Rp ${e.pay.toLocaleString('id-ID')}</div>` : ''}
      </div>`;
    });
    html += '</div>';
    panel.innerHTML = html;
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
  function updateStats() {
    const overtime = getOvertime();
    const cs = document.getElementById('calStats');
    if (!cs) return;
    if (viewMode === 'week') {
      const d = new Date(currentDate); d.setDate(d.getDate() - d.getDay());
      const weekStart = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
      d.setDate(d.getDate() + 6);
      const weekEnd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
      const we = overtime.filter(o => o.date >= weekStart && o.date <= weekEnd);
      const th = we.reduce((s,e) => s + (e.totalHours||0), 0);
      const tp = we.reduce((s,e) => s + (e.pay||0), 0);
      cs.innerHTML = `<span class="cal-stat">Minggu ini: <strong>${we.length}</strong> lembur</span><span class="cal-stat">Total: <strong>${th.toFixed(1)}</strong> jam</span>` + (tp ? `<span class="cal-stat">Uang: <strong>Rp ${tp.toLocaleString('id-ID')}</strong></span>` : '');
      return;
    }
    const monthKey = currentDate.getFullYear() + String(currentDate.getMonth()+1).padStart(2,'0');
    const me = overtime.filter(o => o.date && o.date.slice(0,6) === monthKey);
    const th = me.reduce((s,e) => s + (e.totalHours||0), 0);
    const tp = me.reduce((s,e) => s + (e.pay||0), 0);
    const days = new Set(me.map(o => o.date)).size;
    cs.innerHTML = `<span class="cal-stat">Bulan ini: <strong>${me.length}</strong> lembur</span><span class="cal-stat">Total: <strong>${th.toFixed(1)}</strong> jam</span><span class="cal-stat">Hari: <strong>${days}</strong></span>` + (tp ? `<span class="cal-stat">Uang: <strong>Rp ${tp.toLocaleString('id-ID')}</strong></span>` : '');
  }

  // --- Riwayat ---
  let riwayatPage = 1;
  function renderRiwayat() {
    const overtime = getOvertime();
    const monthFilter = document.getElementById('filterMonth') ? document.getElementById('filterMonth').value : '';
    const catFilter = document.getElementById('filterCat') ? document.getElementById('filterCat').value : '';
    const search = document.getElementById('filterSearch') ? document.getElementById('filterSearch').value.toLowerCase() : '';
    // Populate month filter
    const mf = document.getElementById('filterMonth');
    if (mf && mf.options.length === 0) {
      const months = new Set(overtime.map(o => o.date ? o.date.slice(0,6) : ''));
      months.forEach(m => {
        if (!m) return;
        const d = new Date(m.slice(0,4), m.slice(4,6)-1, 1);
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = d.toLocaleString('id-ID', { month: 'long', year: 'numeric' });
        mf.appendChild(opt);
      });
      const allOpt = document.createElement('option');
      allOpt.value = '';
      allOpt.textContent = 'Semua Bulan';
      mf.insertBefore(allOpt, mf.firstChild);
      mf.value = '';
    }
    let filtered = overtime;
    if (monthFilter) filtered = filtered.filter(o => o.date && o.date.slice(0,6) === monthFilter);
    if (catFilter) filtered = filtered.filter(o => o.category === catFilter);
    if (search) filtered = filtered.filter(o => (o.activity||'').toLowerCase().includes(search));
    filtered.sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const perPage = 15;
    const totalPages = Math.ceil(filtered.length / perPage) || 1;
    if (riwayatPage > totalPages) riwayatPage = totalPages;
    const start = (riwayatPage - 1) * perPage;
    const pageData = filtered.slice(start, start + perPage);
    const tbody = document.getElementById('riwayatBody');
    if (!tbody) return;
    const catLabels = { weekday: 'Hari Kerja', weekend: 'Akhir Pekan', holiday: 'Libur' };
    const badgeClass = { weekday: 'badge-weekday', weekend: 'badge-weekend', holiday: 'badge-holiday' };
    tbody.innerHTML = pageData.length ? pageData.map(o => `
      <tr>
        <td>${formatDateDisplay(o.date)}</td>
        <td>${o.startTime}-${o.endTime}</td>
        <td>${(o.totalHours||0).toFixed(2)}</td>
        <td><span class="badge ${badgeClass[o.category]}">${catLabels[o.category]||o.category}</span></td>
        <td>${o.activity||'-'}</td>
        <td>${o.project||'-'}</td>
        <td>${o.pay ? 'Rp ' + o.pay.toLocaleString('id-ID') : '-'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteEntry('${o.id}')">Hapus</button></td>
      </tr>
    `).join('') : '<tr><td colspan="8" class="empty-state">Belum ada data lembur</td></tr>';
    // Pagination
    let pagHtml = '';
    for (let i = 1; i <= totalPages; i++) {
      pagHtml += `<button class="btn btn-sm ${i===riwayatPage?'btn-primary':''}" onclick="riwayatPage=${i};renderRiwayat()">${i}</button>`;
    }
    const pag = document.getElementById('riwayatPag');
    if (pag) pag.innerHTML = pagHtml;
  }
  function deleteEntry(id) {
    if (!confirm('Hapus data ini?')) return;
    const data = getOvertime().filter(o => o.id !== id);
    saveOvertime(data);
    toast('Data dihapus', 'success');
    renderRiwayat();
  }

  // --- Settings ---
  function loadSettings() {
    const s = getSettings();
    const dr = document.getElementById('defaultRate');
    const un = document.getElementById('userName');
    if (dr) dr.value = s.defaultRate || '';
    if (un) un.value = s.userName || '';
  }
  function saveSettings() {
    const s = getSettings();
    s.defaultRate = parseFloat(document.getElementById('defaultRate').value) || 0;
    s.userName = document.getElementById('userName').value;
    localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(s));
    toast('Settings disimpan', 'success');
  }
  function clearAllData() {
    if (!confirm('Hapus semua data lembur? Tindakan ini tidak bisa dibatalkan.')) return;
    saveOvertime([]);
    toast('Semua data dihapus', 'success');
    navigateTo('ringkasan');
  }

  // --- Import/Export ---
  function exportBackup() {
    const backup = { overtime: getOvertime(), settings: getSettings(), exportedAt: new Date().toISOString() };
    const ws = XLSX.utils.json_to_sheet(backup.overtime);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Overtime');
    XLSX.writeFile(wb, 'easy-absen-backup.xlsx');
    localStorage.setItem('ea_last_backup', Date.now().toString());
    toast('Export berhasil', 'success');
  }
  function importData() {
    const file = document.getElementById('importFile').files[0];
    if (!file) { toast('Pilih file dulu', 'error'); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
      const wb = XLSX.read(e.target.result, { type: 'binary' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws);
      const existing = getOvertime();
      data.forEach(d => { if (!d.id) d.id = genId(); });
      saveOvertime(existing.concat(data));
      toast('Import berhasil: ' + data.length + ' data', 'success');
    };
    reader.readAsBinaryString(file);
  }
  function exportJson() {
    const backup = { overtime: getOvertime(), settings: getSettings(), exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'easy-absen-backup.json';
    a.click(); URL.revokeObjectURL(url);
    localStorage.setItem('ea_last_backup', Date.now().toString());
    toast('Export JSON berhasil', 'success');
  }
  function importJson(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const backup = JSON.parse(e.target.result);
        if (backup.overtime) saveOvertime(backup.overtime);
        if (backup.settings) localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(backup.settings));
        toast('Import JSON berhasil', 'success');
        navigateTo('ringkasan');
      } catch (err) { toast('File tidak valid', 'error'); }
    };
    reader.readAsText(file);
  }

  // --- Keyboard shortcuts ---
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.key === 'n' || e.key === 'N') { navigateTo('catat'); }
    else if (e.key === 'Escape') { document.querySelectorAll('.modal-overlay').forEach(m => m.remove()); }
    else if (e.key === 'ArrowLeft' && currentView === 'kalender') { prevPeriod(); }
    else if (e.key === 'ArrowRight' && currentView === 'kalender') { nextPeriod(); }
  });
  // --- Backup reminder ---
  (function() {
    const lastBackup = localStorage.getItem('ea_last_backup');
    const now = Date.now();
    if (!lastBackup || (now - parseInt(lastBackup)) > 7 * 24 * 60 * 60 * 1000) {
      setTimeout(() => {
        toast('Belum backup 7 hari terakhir. Export data Anda.', 'warning');
      }, 3000);
    }
  })();
  // --- Initial load (after all views registered) ---
  (function() {
    const hash = location.hash.replace('#', '') || 'ringkasan';
    navigateTo(hash);
  })();

  function formatDateDisplay(yyyymmdd) {
    if (!yyyymmdd || yyyymmdd.length !== 8) return yyyymmdd;
    const y = yyyymmdd.slice(0,4), m = yyyymmdd.slice(4,6), d = yyyymmdd.slice(6,8);
    const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return `${d} ${months[parseInt(m)-1]} ${y}`;
  }
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  </script>
</body>
