<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Absen — Karyawan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
  <script src="libs/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">Easy <span>Absen</span></div>
      <ul class="sidebar-nav">
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="input.html">Input Lembur</a></li>
        <li><a href="riwayat.html">Riwayat</a></li>
        <li><a href="import.html">Import/Export</a></li>
        <li><a href="karyawan.html">Karyawan</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </aside>
    <main class="main">
      <div class="page-header">
        <h1>Kelola Karyawan</h1>
        <button class="btn btn-primary" onclick="showAddModal()">+ Tambah Karyawan</button>
      </div>

      <div class="card">
        <div class="filter-bar">
          <input type="text" id="search" class="form-control" placeholder="Cari nama..." oninput="renderTable()">
        </div>
        <div class="table-container">
          <table>
            <thead><tr><th>Nama</th><th>Department</th><th>Jumlah Lembur</th><th>Aksi</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    function renderTable() {
      const search = document.getElementById('search').value.toLowerCase();
      let emps = getEmployees();
      if (search) emps = emps.filter(e => e.name.toLowerCase().includes(search));
      const overtime = getOvertime();
      const counts = {};
      overtime.forEach(o => { counts[o.employeeId] = (counts[o.employeeId]||0) + 1; });

      document.getElementById('tbody').innerHTML = emps.length
        ? emps.map(e => `
          <tr>
            <td>${e.name}</td>
            <td>${e.department||'-'}</td>
            <td>${counts[e.id]||0}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="editEmp('${e.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteEmp('${e.id}')">Hapus</button>
            </td>
          </tr>
        `).join('')
        : '<tr><td colspan="4" class="empty-state">Belum ada karyawan</td></tr>';
    }

    function showAddModal() {
      showModal(`
        <h2>Tambah Karyawan</h2>
        <div class="form-group"><label>Nama</label><input type="text" id="m-name" class="form-control" required></div>
        <div class="form-group"><label>Department</label><input type="text" id="m-dept" class="form-control"></div>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="closeModal()">Batal</button>
          <button class="btn btn-primary" onclick="addEmp()">Simpan</button>
        </div>
      `);
    }

    function addEmp() {
      const name = document.getElementById('m-name').value.trim();
      if (!name) { showToast('Nama wajib diisi', 'error'); return; }
      const emps = getEmployees();
      emps.push({ id: genId(), name, department: document.getElementById('m-dept').value.trim(), createdAt: new Date().toISOString() });
      saveEmployees(emps);
      closeModal();
      showToast('Karyawan ditambahkan', 'success');
      renderTable();
    }

    function editEmp(id) {
      const emp = getEmployees().find(e => e.id === id);
      if (!emp) return;
      showModal(`
        <h2>Edit Karyawan</h2>
        <div class="form-group"><label>Nama</label><input type="text" id="m-name" class="form-control" value="${emp.name}"></div>
        <div class="form-group"><label>Department</label><input type="text" id="m-dept" class="form-control" value="${emp.department||''}"></div>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="closeModal()">Batal</button>
          <button class="btn btn-primary" onclick="saveEmp('${id}')">Simpan</button>
        </div>
      `);
    }

    function saveEmp(id) {
      const emps = getEmployees();
      const idx = emps.findIndex(e => e.id === id);
      if (idx === -1) return;
      emps[idx].name = document.getElementById('m-name').value.trim();
      emps[idx].department = document.getElementById('m-dept').value.trim();
      saveEmployees(emps);
      closeModal();
      showToast('Diupdate', 'success');
      renderTable();
    }

    function deleteEmp(id) {
      if (!confirm('Hapus karyawan ini? Data lemburnya tetap ada.')) return;
      const emps = getEmployees().filter(e => e.id !== id);
      saveEmployees(emps);
      showToast('Dihapus', 'success');
      renderTable();
    }

    renderTable();
  </script>
</body>
</html>
